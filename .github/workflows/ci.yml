name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      # Mypy is a RATCHET, not a pass/fail gate — because it has never passed here. 23 errors
      # predate this ratchet, 18 of them in dispatch_cli where one `result` name is reused across
      # mutually exclusive command branches, so mypy keeps the first binding's type. Those are not
      # runtime bugs and the honest fix is distinct names in a 750-line function — a refactor, not
      # something to block every incoming pull request on in the meantime.
      #
      # So: existing debt does not fail the build, NEW debt does. Nothing is silenced — the full
      # output is printed every run and the count is compared out loud. When the count drops, lower
      # MYPY_BASELINE in the same commit; a ratchet that never tightens is just noise.
      - name: Mypy (ratchet)
        env:
          MYPY_BASELINE: "23"
        run: |
          set +e
          mypy memem | tee /tmp/mypy.txt
          set -e
          count=$(grep -c "error:" /tmp/mypy.txt || true)
          echo "mypy errors: $count (baseline $MYPY_BASELINE)"
          if [ "$count" -gt "$MYPY_BASELINE" ]; then
            echo "::error::mypy went from $MYPY_BASELINE to $count — this change adds type debt"
            exit 1
          fi
          if [ "$count" -lt "$MYPY_BASELINE" ]; then
            echo "::notice::mypy is down to $count — lower MYPY_BASELINE to $count in this commit to hold the gain"
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Pytest
        run: pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build wheel + sdist
        run: python -m build
      - name: Install wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-venv
          /tmp/wheel-venv/bin/pip install --upgrade pip
          /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: Smoke-test the installed wheel
        run: |
          /tmp/wheel-venv/bin/python -m memem.server --rebuild-index
          /tmp/wheel-venv/bin/python -c "import memem; print(memem.__version__)"
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
